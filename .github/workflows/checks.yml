name: Distribution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m compileall -q bridge.py assets.py runtime engine vendor
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node --check browser_extension/worker.js
      - run: node --check browser_extension/offscreen.js
      - name: Compile Windows capture helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & 'C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe' /nologo /platform:x64 /target:exe /out:ProcessAudio.exe ProcessAudio.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
