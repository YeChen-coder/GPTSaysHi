name: gptsayshi
services:
  avatar:
    image: gptsayshi:local
    build: .
    gpus: all
    restart: "no"
    mem_limit: 6g
    cpus: 4
    environment:
      FEATHERTALK_CHARACTER: ${GPTSAYSHI_CHARACTER:-QinChe}
      FEATHERTALK_MODE: fast
      FEATHERTALK_BUFFER_MS: "100"
    volumes:
      - ./assets:/work:ro
    ports:
      - "127.0.0.1:19088:8081"
    networks: [local]
networks:
  local:
    driver: bridge
